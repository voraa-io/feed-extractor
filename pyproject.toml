[project]
name = "feed-extractor"
version = "0.1.0"
description = "San Pedro Garza García local events, discounts, and promotions feed pipeline"
authors = [
    {name = "voraa"}
]
requires-python = ">=3.11"
dependencies = [
    "httpx (>=0.28.1,<0.29.0)",
    "beautifulsoup4 (>=4.14.3,<5.0.0)",
    "lxml (>=6.0.2,<7.0.0)",
    "supabase (>=2.28.3,<3.0.0)",
    "python-dateutil (>=2.9.0.post0,<3.0.0)",
    "python-dotenv (>=1.2.2,<2.0.0)",
    "click (>=8.3.1,<9.0.0)",
    "psycopg2-binary (>=2.9.11,<3.0.0)"
]


[[tool.poetry.packages]]
include = "feed_extractor"
from = "src"

[tool.poetry.scripts]
feed-extractor = "feed_extractor.__main__:cli"

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"
