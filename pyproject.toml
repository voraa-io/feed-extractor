[build-system]
requires = ["hatchling"]
build-backend = "hatchling.backends"

[project]
name = "feed-extractor"
version = "0.1.0"
description = "San Pedro Garza García local events, discounts, and promotions feed pipeline"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27",
    "beautifulsoup4>=4.12",
    "lxml>=5.0",
    "supabase>=2.0",
    "python-dateutil>=2.9",
    "python-dotenv>=1.0",
    "click>=8.1",
]

[project.scripts]
feed-extractor = "feed_extractor.__main__:cli"

[tool.hatch.build.targets.wheel]
packages = ["src/feed_extractor"]

[tool.hatch.build.targets.sdist]
include = ["src/feed_extractor"]
