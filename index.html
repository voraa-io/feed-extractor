/* V4: guest profile and confirmed vs. pending in-person payments */
.topright{font-size:12px;letter-spacing:.015em}
.waitingMark{width:62px;height:62px;border:2px solid rgba(27,24,21,.28);border-radius:50%;display:grid;place-items:center}
.waitingMark svg{height:32px;width:32px;fill:none;stroke:var(--ink);stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
.pendingLine{display:flex;align-items:center;gap:7px;color:#8b6530;font-size:12px;line-height:1.4;margin:12px 0 0}
.pendingLine svg{height:16px;width:16px;fill:none;stroke:currentColor;stroke-width:1.7}
.staffPayment{padding:17px 0;border-bottom:1px solid var(--hair)}
.staffPaymentRow{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
.staffPaymentRow div{display:flex;flex-direction:column;gap:5px}
.staffPaymentRow strong{font-size:14px;letter-spacing:-.02em}
.staffPaymentRow small{font-size:11px;color:var(--muted)}
.staffPaymentRow .pendingStatus{color:#8b6530}
.staffPaymentRow .confirmedStatus{color:#286d4c}
.staffConfirm{background:var(--ink);color:var(--paper);border:0;border-radius:16px;padding:14px 16px;width:100%;font-size:13px;font-weight:700;margin-top:15px}
.staffCancel{color:var(--muted);background:none;border:0;font-size:12px;padding:12px 0 0;width:100%}
.profile{padding-top:31px}
.profileIntro{display:flex;align-items:center;gap:14px;margin-bottom:20px}
.avatarGuest{width:58px;height:58px;border-radius:50%;background:#E8E9E1;border:1px solid rgba(27,24,21,.08);display:grid;place-items:center}
.avatarGuest svg{height:25px;width:25px;fill:none;stroke:var(--ink);stroke-width:1.35;stroke-linecap:round;stroke-linejoin:round}
.profileName{font-size:28px;line-height:1.1;font-weight:750;letter-spacing:-.055em}
.connectAccount{display:flex;align-items:center;justify-content:space-between;border:0;border-radius:16px;background:#F0F1E8;color:var(--ink);font-size:12px;font-weight:650;padding:16px;width:100%;text-align:left}
.connectAccount span{color:var(--blue);font-size:18px}
.profileStats{display:grid;grid-template-columns:1fr 1fr;gap:11px;margin-top:28px}
.profileStats>div{padding:22px 20px;border:1px solid var(--hair);border-radius:23px;min-height:112px;display:flex;flex-direction:column;justify-content:space-between}
.profileStats span{font-size:12px;color:var(--muted)}
.profileStats strong{font-size:38px;line-height:1;font-weight:760;letter-spacing:-.07em}
.profileHeading{font-size:17px;letter-spacing:-.035em;margin:34px 0 13px;font-weight:750}
.placeCard{width:100%;display:flex;align-items:center;gap:12px;padding:17px 14px;background:rgba(255,255,255,.42);border:1px solid var(--hair);border-radius:21px;text-align:left}
.placeBadge{width:45px;height:45px;border-radius:50%;display:grid;place-items:center;flex-shrink:0;border:1px solid var(--hair);font:28px 'Instrument Serif',Georgia,serif}
.placeMain{display:flex;flex-direction:column;gap:5px;flex:1;min-width:0}
.placeMain strong{font-size:14px;letter-spacing:-.025em}
.placeMain small,.pointsCount small{font-size:11px;color:var(--muted)}
.pointsCount{display:flex;flex-direction:column;align-items:flex-end;gap:2px}
.pointsCount strong{font-size:26px;letter-spacing:-.07em}
.visitRow{border:0;border-bottom:1px solid var(--hair);background:none;width:100%;display:flex;justify-content:space-between;gap:13px;text-align:left;padding:16px 0;align-items:center}
.visitRow>span:first-child{display:flex;flex-direction:column;gap:6px}
.visitRow strong{font-size:13px;letter-spacing:-.02em}
.visitRow small{color:var(--muted);font-size:11px}
.statusText{font-size:12px;font-weight:650;text-align:right;white-space:nowrap}
.confirmedStatus{color:#286d4c}.pendingStatus{color:#8b6530}
.emptyState{font-size:13px;color:var(--muted);border:1px dashed var(--hair);border-radius:19px;padding:25px 18px}

.loyaltyDot.active{border-color:var(--blue);color:var(--blue)}

<script>
(()=>{'use strict';
const ticket=[
['Servicio de mesa',0],['Agua mineral 355ml',65],['Vaso chelado',25],['Clamato preparado',95],
['Cerveza XX Lager 355ml',70],['Vodka Stolichnaya 750ml',120],['Pincho de alitas',185],
['Cerveza XX Lager 355ml',70],['Ensalada de la casa',445],['Pollo orgánico bodegonero',595],
['Vaso chelado',25],['Agua mineral 355ml',65],['Carajillo',190]
].map(([name,price],id)=>({id,name,price}));
const FULL=1950,VENUE='Bodegón San Agustín',TABLE='Mesa 14',TICKET_ID='BODEGON-M14-291026',KEY='voraa-bodegon-14-flow-v4';
const app=document.getElementById('app');
let store={payments:[],visits:[],identity:'guest'};
try{const saved=JSON.parse(localStorage.getItem(KEY));if(saved&&typeof saved==='object'){store={...store,...saved};}}catch{}
if(!Array.isArray(store.payments))store.payments=[];
if(!Array.isArray(store.visits))store.visits=[];
let page=(new URLSearchParams(location.search).has('staff')||location.hash==='#staff')?'staff':'checkout';
let sheet='',mode='all',parts=2,custom='',tipPercent=15,customTip=null,method='',itemIds=new Set(),phone='',error='',currentPaymentId=null;
let visitAutoOpened=false,visitCountdown=5,visitTimer=null;
function money(n){return '$'+(Math.round((Number(n)||0)*100)/100).toLocaleString('es-MX',{minimumFractionDigits:2,maximumFractionDigits:2})}
function hero(n){const [i,d]=money(n).split('.');return `${i}<span class="cent">.${d}</span>`}
function paid(){return Math.round(store.payments.filter(p=>p.status==='confirmed').reduce((s,p)=>s+p.base,0)*100)/100}
function pending(){return Math.round(store.payments.filter(p=>p.status==='pending').reduce((s,p)=>s+p.base,0)*100)/100}
function remaining(){return Math.max(0,Math.round((FULL-paid())*100)/100)}
function available(){return Math.max(0,Math.round((FULL-paid()-pending())*100)/100)}
function usedItems(){return new Set(store.payments.filter(p=>p.status!=='cancelled').flatMap(p=>p.items||[]))}
function base(){const r=available();if(mode==='equal')return Math.min(r,Math.round(FULL/parts*100)/100);if(mode==='custom')return Math.min(r,Math.max(0,Number(custom)||0));if(mode==='items')return Math.min(r,ticket.filter(x=>itemIds.has(x.id)).reduce((s,x)=>s+x.price,0));return r}
function tip(){return Math.round((customTip!==null?customTip:base()*tipPercent/100)*100)/100}
function total(){return Math.round((base()+tip())*100)/100}
function esc(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function icon(name){const paths={
check:'<path d="M5 12.5l4.5 4.5L19 7.5"/>',
arrow:'<path d="M6 12h12m-5-5 5 5-5 5"/>',
card:'<rect x="2.5" y="5" width="19" height="14" rx="2"/><path d="M2.5 10h19"/>',
bank:'<path d="M3 10h18M4 10l8-6 8 6M5 10v9m5-9v9m4-9v9m5-9v9M3 20h18"/>',
terminal:'<rect x="5" y="2.5" width="14" height="19" rx="3"/><path d="M9 7h6M9 12h6M12 17h.01"/>',
cash:'<rect x="2" y="6" width="20" height="12" rx="2"/><circle cx="12" cy="12" r="3"/><path d="M5 9h1M18 15h1"/>',
split:'<path d="M4 7h6l4 5h6M4 17h6l4-5h6"/>',
wallet:'<path d="M3 7h18v14H3zM3 7V5a2 2 0 012-2h13v4M16 15h5"/>',
clock:'<circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/>',
star:'<path d="m12 2 3 6.7 7.3.8-5.4 4.9 1.5 7.1L12 18l-6.4 3.5 1.5-7.1-5.4-4.9 7.3-.8z"/>',
user:'<circle cx="12" cy="8" r="4"/><path d="M4 21v-2a8 8 0 0 1 16 0v2"/>'};
return `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" aria-hidden="true">${paths[name]||paths.check}</svg>`}
function persist(){try{localStorage.setItem(KEY,JSON.stringify(store))}catch{}}

return `${header()}<main class="screen">${merchant()}<div class="eyebrow">Saldo de la cuenta</div><h1 class="hero">${hero(remaining())}</h1>${paid()>0?`<div class="paidbar"><span style="width:${100*paid()/FULL}%"></span></div><div class="merchantSub" style="margin-top:9px">${money(paid())} de ${money(FULL)} cubiertos</div>`:''}${pending()>0?`<p class="pendingLine">${icon('clock')} ${money(pending())} por confirmar con el restaurante</p>`:''}<button class="ticketLink" data-act="ticket"><span>Tu ticket · 13 artículos</span><strong>Ver detalle ↗</strong></button><div class="hair"></div><section class="part"><div><div class="partTitle">Tu parte · ${money(base())}</div><div class="partSub">${summaryPortion()}</div></div><button class="textAction" data-act="split">Dividir ↗</button></section><div class="hair"></div><section class="tips"><div class="sectionTitle">Propina para Obed y el equipo</div><div class="tipsGrid">${[10,15,20].map(p=>`<button class="tip" aria-pressed="${tipPercent===p&&customTip===null}" data-tip="${p}"><span>${p}%</span>${p===15?'<span class="tipPopular">Más popular</span>':''}</button>`).join('')}</div><div class="tipExtras"><button class="customTip ${customTip!==null?'isActive':''}" data-act="customTip">${customTip!==null?`Otro importe · ${money(customTip)}`:'Otro importe'}</button><button class="customTip ${customTip===null&&tipPercent===0?'isActive':''}" data-tip="0">Sin propina</button></div></section></main><footer class="paybar"><div class="total"><span>Total a pagar</span><strong>${money(total())}</strong></div><button class="primary" data-act="pay">Pagar</button></footer>`}
function paidAll(){return `${header()}<main class="screen success"><div class="doneMark">${icon('check')}</div><h1 class="doneTitle">Cuenta cubierta.</h1><p class="doneSub">${VENUE} · ${TABLE}</p><div class="confirmation"><div class="confirmRow"><span>Total de la cuenta</span><strong>${money(FULL)}</strong></div><div class="confirmRow"><span>Pagos confirmados</span><strong>${store.payments.filter(p=>p.status==='confirmed').length}</strong></div></div></main><footer class="paybar"><button class="primary" data-act="toProfile">Ver mis visitas</button></footer>`}
function currentPayment(){return store.payments.find(p=>p.id===currentPaymentId)||store.payments.at(-1)||null}
function success(){const last=currentPayment();return `${header()}<main class="screen success"><div class="doneMark">${icon('check')}</div><h1 class="doneTitle">Gracias por venir.</h1><p class="doneSub">Tu parte de ${money(last?.base||0)} quedó registrada.<br>${VENUE} · ${TABLE}</p><div class="confirmation" style="margin-top:33px"><div class="confirmRow"><span>Método</span><strong>${esc(last?.method||'')}</strong></div><div class="confirmRow"><span>Propina</span><strong>${money(last?.tip||0)}</strong></div><div class="confirmRow"><span>Saldo de la mesa</span><strong>${money(remaining())}</strong></div></div><p class="minNote" style="margin-top:22px">${remaining()>0?'Los demás pueden usar este mismo QR para cubrir su parte.':'Gracias por compartir tu mesa con nosotros.'}</p><p class="minNote" style="margin-top:10px">En esta experiencia no se procesan pagos reales.</p></main><footer class="paybar"><button class="primary" data-act="toProfile">Terminar</button>${!visitAutoOpened?`<div class="tinyVisitCountdown" id="visitCountdown">Guarda tu visita en ${visitCountdown} s</div>`:''}</footer>`}
function waiting(){const p=currentPayment();return `${header()}<main class="screen success"><div class="waitingMark">${icon('clock')}</div><div class="overline" style="margin-top:25px">Esperando al restaurante</div><h1 class="doneTitle">Obed confirma tu pago.</h1><p class="doneSub">Muéstrale esta pantalla cuando hayas pagado ${p?.method==='Efectivo'?'en efectivo':'con la terminal'}. Él confirmará el cobro de ${money((p?.base||0)+(p?.tip||0))}.</p><div class="confirmation" style="margin-top:26px"><div class="confirmRow"><span>Tu cuenta</span><strong>${money(p?.base||0)}</strong></div><div class="confirmRow"><span>Propina</span><strong>${money(p?.tip||0)}</strong></div><div class="confirmRow"><span>Estado</span><strong style="color:#8b6530">Por confirmar</strong></div></div><p class="minNote" style="margin-top:25px">Tu visita aparece en el perfil. Recibirás tus puntos cuando el restaurante confirme el pago.</p></main><footer class="paybar"><button class="primary" data-act="toProfile">Terminar</button><button class="secondary" data-act="cancelPending">Cambiar forma de pago</button></footer>`}
function waitingAll(){return `${header()}<main class="screen success"><div class="waitingMark">${icon('clock')}</div><h1 class="doneTitle">Pago por confirmar.</h1><p class="doneSub">El restaurante está verificando el último cobro de la mesa.</p><div class="confirmation"><div class="confirmRow"><span>Pagado</span><strong>${money(paid())}</strong></div><div class="confirmRow"><span>Pendiente de confirmar</span><strong>${money(pending())}</strong></div></div></main><footer class="paybar"><button class="primary" data-act="toProfile">Ver mis visitas</button></footer>`}
function visitDate(date){try{return new Date(date).toLocaleDateString('es-MX',{day:'numeric',month:'short',year:'numeric'})}catch{return 'Hoy'}}
function visitStatus(v){return v.status==='confirmed'?'Confirmada':v.status==='pending'?'Por confirmar':'Cancelada'}
function profile(){const all=store.visits.filter(v=>!v.discarded);const confirmed=all.filter(v=>v.status==='confirmed'),pendingVisits=all.filter(v=>v.status==='pending');const points=confirmed.reduce((s,v)=>s+(v.points||0),0);
const venueGroups=new Map();for(const v of all){if(!venueGroups.has(v.restaurant))venueGroups.set(v.restaurant,[]);venueGroups.get(v.restaurant).push(v)}
return `${header()}<main class="screen profile"><div class="profileIntro"><div class="avatarGuest">${icon('user')}</div><div><div class="profileName">${store.identity==='guest'?'Invitado':'Mi perfil'}</div><div class="merchantSub">${store.identity==='guest'?'Tus visitas en este dispositivo':'Mis visitas y recompensas'}</div></div></div>${store.identity==='guest'?`<button class="connectAccount" data-act="identity">Guardar mis visitas en una cuenta <span>↗</span></button>`:''}<div class="profileStats"><div><span>Visitas</span><strong>${all.length}</strong></div><div><span>Puntos</span><strong>${points}</strong></div></div><h2 class="profileHeading">Tus lugares</h2>${venueGroups.size?[...venueGroups.entries()].map(([name,visits])=>{const ok=visits.filter(v=>v.status==='confirmed');const pts=ok.reduce((s,v)=>s+(v.points||0),0);const pend=visits.filter(v=>v.status==='pending').length;return `<button class="placeCard" data-act="visitDetail" data-venue="${esc(name)}"><span class="placeBadge">B</span><span class="placeMain"><strong>${esc(name)}</strong><small>${visits.length} ${visits.length===1?'visita':'visitas'}${pend?` · ${pend} por confirmar`:''}</small></span><span class="pointsCount"><strong>${pts}</strong><small>${pts===1?'punto':'puntos'}</small></span></button>`}).join(''):`<div class="emptyState">Todavía no tienes visitas guardadas.</div>`}<h2 class="profileHeading" style="margin-top:32px">Mis visitas</h2>${all.length?all.slice().reverse().map(v=>`<button class="visitRow" data-act="visitDetail" data-venue="${esc(v.restaurant)}"><span><strong>${esc(v.restaurant)}</strong><small>${visitDate(v.date)} · ${esc(v.table||TABLE)}</small></span><span class="statusText ${v.status==='confirmed'?'confirmedStatus':'pendingStatus'}">${v.status==='confirmed'?'+'+v.points+' punto':visitStatus(v)}</span></button>`).join(''):`<p class="sheetDesc" style="margin-top:15px">Cuando pagues y el restaurante confirme tu cuenta, tus visitas aparecerán aquí.</p>`}${store.identity==='guest'?`<p class="minNote" style="margin-top:24px">Como invitado, las visitas se conservan en este navegador. No se sincronizan con otros dispositivos.</p>`:''}</main><footer class="paybar"><button class="secondary" data-act="toCheckout">Volver al ticket</button></footer>`}
function staff(){const confirmed=store.payments.filter(p=>p.status==='confirmed'),pend=store.payments.filter(p=>p.status==='pending');return `${header()}<main class="screen"><div class="staffHeader"><div class="overline">Restaurante</div><button data-act="toCheckout">Ver cuenta ↗</button></div><h1 class="doneTitle" style="margin-top:16px">Mesa 14</h1><p class="doneSub">${VENUE} · Obed M.</p><div class="staffKpi"><div><div class="overline">Confirmado</div><strong>${money(paid())}</strong></div><div><div class="overline">Por cobrar</div><strong>${money(remaining())}</strong></div></div><div class="paidbar" style="margin-top:25px"><span style="width:${100*paid()/FULL}%"></span></div><div class="staffLog"><div class="overline">Movimientos de la mesa</div>${store.payments.length?store.payments.filter(p=>p.status!=='cancelled').map(p=>`<div class="staffPayment"><div class="staffPaymentRow"><div><strong>${esc(p.method)}</strong><small>${esc(p.when||'')} · Propina ${money(p.tip)}</small></div><div style="text-align:right"><strong>${money(p.base+p.tip)}</strong><small class="${p.status==='pending'?'pendingStatus':'confirmedStatus'}">${p.status==='pending'?'Por confirmar':'Confirmado'}</small></div></div>${p.status==='pending'?`<button class="staffConfirm" data-act="staffConfirm" data-id="${esc(p.id)}">Confirmar cobro recibido</button><button class="staffCancel" data-act="staffCancel" data-id="${esc(p.id)}">No se recibió el pago</button>`:''}</div>`).join(''):'<p class="sheetDesc" style="margin-top:18px">Todavía no hay movimientos.</p>'}</div><p class="minNote" style="margin-top:24px">Confirma solamente pagos recibidos. Esta vista usa datos locales y no está conectada al POS.</p></main><footer class="paybar"><button class="secondary" data-act="toCheckout">Volver a cuenta</button><button class="secondary" data-act="clearAll">Reiniciar mesa</button></footer>`}
function sheetHtml(){if(!sheet)return '';let b='',f='';
if(sheet==='split'){b=`<div class="sheetTitle">¿Cómo dividimos la cuenta?</div><p class="sheetDesc">Cada persona elige su parte y paga como prefiera.</p>${[['all','Cuenta completa',money(available())],['eq2','Entre 2','Mitad de la cuenta'],['eq3','Entre 3','Un tercio'],['eq4','Entre 4','Un cuarto'],['items','Por platillos','Elige lo que consumiste'],['custom','Otro monto','Escribe cuánto pagar']].map(([key,title,sub])=>`<button class="choice" data-split="${key}"><strong>${title}</strong><span>${sub}</span><span class="arrow">›</span></button>`).join('')}`}
else if(sheet==='items'){const used=usedItems();b=`<div class="sheetTitle">Tus platillos.</div><p class="sheetDesc">Elige los que vas a pagar.</p><div class="items">${ticket.map(x=>`<label class="item" style="${used.has(x.id)?'opacity:.28':''}"><input type="checkbox" data-item="${x.id}" ${itemIds.has(x.id)?'checked':''} ${used.has(x.id)?'disabled':''}><span class="itemName">${esc(x.name)}</span><span class="itemAmount">${money(x.price)}</span></label>`).join('')}</div><div class="sheetTotal"><span>Tu parte</span><strong id="itemTotal">${money(base())}</strong></div>`;f=`<button class="primary" data-act="applyItems" ${base()<=0?'disabled':''}>Elegir esta parte</button>`}
else if(sheet==='custom'){b=`<div class="sheetTitle">Tu parte.</div><p class="sheetDesc">¿Cuánto de la cuenta quieres cubrir?</p><div class="fieldTitle">Importe en pesos</div><input class="field" data-input="custom" inputmode="decimal" type="number" min="1" max="${available()}" step=".01" placeholder="0.00" value="${esc(custom)}"><div class="minNote" style="margin-top:13px">Disponible por pagar: ${money(available())}</div><div class="error">${esc(error)}</div>`;f=`<button class="primary" data-act="applyCustom">Elegir monto</button>`}
else if(sheet==='tipcustom'){b=`<div class="sheetTitle">Otra propina.</div><p class="sheetDesc">El importe se añade solo a tu parte.</p><div class="fieldTitle">Propina en pesos</div><input class="field" data-input="customTip" inputmode="decimal" type="number" min="0" step=".01" placeholder="0.00" value="${customTip===null?'':customTip}">`;f=`<button class="primary" data-act="applyTip">Guardar propina</button>`}
else if(sheet==='method'){b=`<div class="sheetTitle">¿Cómo quieres pagar?</div>${[['wallet','Apple Pay','wallet'],['card','Tarjeta de crédito o débito','card'],['terminal','Terminal del mesero','terminal'],['cash','Efectivo','cash'],['codi','CoDi · desde tu banco','bank']].map(([key,title,ico])=>`<button class="choice" data-method="${key}"><span class="choiceIcon">${icon(ico)}</span><strong>${title}</strong><span class="arrow">›</span></button>`).join('')}`}
else if(sheet==='confirm'){const label={wallet:'Apple Pay',card:'Tarjeta',codi:'CoDi'}[method];b=`<div class="overline" style="margin-top:18px">${VENUE}</div><div class="sheetTitle" style="font-size:39px;margin-top:17px">${money(total())}</div><p class="sheetDesc">${label}</p><div class="confirmation"><div class="confirmRow"><span>Tu consumo</span><strong>${money(base())}</strong></div><div class="confirmRow"><span>Propina</span><strong>${money(tip())}</strong></div></div><div class="safety">No se realizará ningún cargo real.</div>`;f=`<button class="primary" data-act="confirm">Confirmar</button>`}
else if(sheet==='phone'){b=`<div class="sheetTitle">Paga desde tu banco.</div><p class="sheetDesc">Ingresa el celular registrado en CoDi para recibir una solicitud de cobro.</p><div class="fieldTitle">Número celular</div><input class="field" data-input="phone" type="tel" inputmode="numeric" maxlength="10" placeholder="81 0000 0000" value="${esc(phone)}"><div class="error">${esc(error)}</div><div class="safety">No se enviará una solicitud bancaria en este recorrido.</div>`;f=`<button class="primary" data-act="request">Continuar</button>`}
else if(sheet==='offline'){const cash=method==='cash';b=`<div class="sheetTitle">${cash?'Pagar en efectivo.':'Pagar con el mesero.'}</div><p class="sheetDesc">${cash?'Entrégale el efectivo a Obed para cubrir tu parte.':'Obed te traerá la terminal para cobrar tu parte.'} Tu visita quedará pendiente hasta que confirme el pago.</p><div class="confirmation"><div class="confirmRow"><span>Consumo</span><strong>${money(base())}</strong></div><div class="confirmRow"><span>Propina</span><strong>${money(tip())}</strong></div><div class="confirmRow"><span>Total</span><strong>${money(total())}</strong></div></div>`;f=`<button class="primary" data-act="offlineRequest">${cash?'Continuar con efectivo':'Solicitar terminal'}</button>`}
else if(sheet==='ticket'){b=`<div class="sheetTitle">Tu ticket.</div><div class="sheetDesc">${VENUE} · ${TABLE}</div><div class="detailList">${ticket.map(x=>`<div class="detailItem"><span>${esc(x.name)}</span><span>${money(x.price)}</span></div>`).join('')}<div class="detailItem" style="font-size:15px;font-weight:700"><span>Total</span><span>${money(FULL)}</span></div></div>`}
else if(sheet==='loyalty'){b=`<div class="sheetTitle serif">Guarda tu visita.</div><p class="sheetDesc">Tu visita a ${VENUE} ya está en este dispositivo. Si la guardas en una cuenta, podrás verla cuando cambies de teléfono. Los puntos se acreditan tras confirmar el pago.</p><div class="loyaltyDots">${[0,1,2,3,4].map((v)=>`<span class="loyaltyDot ${v===0?'active':''}">${v===0?'★':'·'}</span>`).join('')}</div>`;f=`<button class="primary" data-act="saveVisit">Guardar mi visita</button><button class="secondary" data-act="guestContinue">Continuar sin cuenta</button><button class="decline" data-act="declineVisit">No la quiero guardar ni quiero recompensas</button>`}
else if(sheet==='identity'){b=`<div class="sheetTitle">Guarda tus visitas.</div><p class="sheetDesc">Elige cómo conectar tu perfil. Puedes seguir como invitado y guardar esta visita en tu dispositivo.</p><button class="choice" data-act="authApple"><strong>Continuar con Apple</strong><span class="arrow">›</span></button><button class="choice" data-act="authPhone"><strong>Usar mi número de celular</strong><span class="arrow">›</span></button>`;f=`<button class="secondary" data-act="guestContinue">Continuar sin cuenta</button>`}
else if(sheet==='authUnavailable'){b=`<div class="sheetTitle">Tu visita está aquí.</div><p class="sheetDesc">La conexión de cuentas todavía no está disponible. Puedes continuar como invitado y conservar tus visitas en este dispositivo.</p>`;f=`<button class="primary" data-act="guestContinue">Continuar como invitado</button>`}
else if(sheet==='visitDetail'){const vs=store.visits.filter(v=>v.restaurant===VENUE&&!v.discarded).slice().reverse();b=`<div class="sheetTitle serif">${VENUE}</div><p class="sheetDesc">${vs.length} ${vs.length===1?'visita':'visitas'} registradas · ${vs.filter(v=>v.status==='confirmed').reduce((s,v)=>s+(v.points||0),0)} puntos</p>${vs.map(v=>`<div class="detailItem"><span>${visitDate(v.date)}<br><small class="muted">${esc(v.table)}</small></span><span>${v.status==='confirmed'?`+${v.points} punto`:visitStatus(v)}</span></div>`).join('')}`;f=`<button class="primary" data-act="close">Listo</button>`}
return `<div class="sheetScrim" data-act="close" aria-hidden="true"></div><section class="sheet" role="dialog" aria-modal="true" aria-label="Opciones de la cuenta"><span class="grab"></span><div class="sheetHead"><span></span><button class="close" data-act="close" aria-label="Cerrar">×</button></div><div class="sheetBody">${b}</div>${f?`<div class="sheetFoot">${f}</div>`:''}</section>`}
function paint(){app.innerHTML=(page==='staff'?staff():page==='profile'?profile():page==='waiting'?waiting():page==='success'?success():checkout())+sheetHtml();document.body.style.overflow=sheet?'hidden':'';}
function stopVisitTimer(){if(visitTimer!==null){clearInterval(visitTimer);visitTimer=null}}
function beginVisitTimer(){stopVisitTimer();visitAutoOpened=false;visitCountdown=5;visitTimer=setInterval(()=>{if(page!=='success'||sheet){stopVisitTimer();return}visitCountdown-=1;const el=document.getElementById('visitCountdown');if(el)el.textContent=`Guarda tu visita en ${Math.max(0,visitCountdown)} s`;if(visitCountdown<=0){stopVisitTimer();visitAutoOpened=true;open('loyalty')}},1000)}
function open(name){sheet=name;error='';paint()}
function close(){sheet='';error='';paint()}
function makePayment(status){const share=base();if(!(share>0)||share>available()||store.payments.length>40)return null;const p={id:'p'+Date.now().toString(36)+Math.random().toString(36).slice(2,7),base:share,tip:tip(),status,method:{wallet:'Apple Pay',card:'Tarjeta',codi:'CoDi',terminal:'Terminal del mesero',cash:'Efectivo'}[method],items:mode==='items'?[...itemIds]:[],when:new Date().toLocaleTimeString('es-MX',{hour:'2-digit',minute:'2-digit'}),createdAt:new Date().toISOString()};store.payments.push(p);currentPaymentId=p.id;updateVisitFromLedger();persist();return p}
function updateVisitFromLedger(){const confirmed=store.payments.some(p=>p.status==='confirmed'),pendingPayments=store.payments.some(p=>p.status==='pending');if(!confirmed&&!pendingPayments){store.visits=store.visits.filter(v=>v.ticketId!==TICKET_ID);return;}let v=store.visits.find(v=>v.ticketId===TICKET_ID);if(!v){v={id:'v'+Date.now().toString(36),ticketId:TICKET_ID,restaurant:VENUE,table:TABLE,date:new Date().toISOString(),status:pendingPayments?'pending':'confirmed',points:0,discarded:false};store.visits.push(v)}if(v.discarded)return;v.status=confirmed?'confirmed':pendingPayments?'pending':'cancelled';v.points=confirmed?1:0;}
function finishDigital(){if(!makePayment('confirmed'))return;sheet='';page='success';paint();window.scrollTo(0,0);beginVisitTimer()}
function startOffline(){if(!makePayment('pending'))return;sheet='';page='waiting';paint();window.scrollTo(0,0)}
function confirmOffline(id){const p=store.payments.find(p=>p.id===id&&p.status==='pending');if(!p)return;p.status='confirmed';updateVisitFromLedger();persist();if(page==='waiting'&&currentPaymentId===id){page='success';paint();beginVisitTimer()}else paint()}
function cancelOffline(id){const p=store.payments.find(p=>p.id===id&&p.status==='pending');if(!p)return;p.status='cancelled';updateVisitFromLedger();persist();if(page==='waiting'&&currentPaymentId===id){resetPortion();page='checkout'}paint()}
function goHome(){stopVisitTimer();page='checkout';resetPortion();sheet='';paint();window.scrollTo(0,0)}
function toProfile(){stopVisitTimer();sheet='';page='profile';paint();window.scrollTo(0,0)}
function declineVisit(){const v=store.visits.find(v=>v.ticketId===TICKET_ID);if(v)v.discarded=true;persist();toProfile()}
function clearEverything(){stopVisitTimer();store={payments:[],visits:[],identity:'guest'};persist();goHome()}
app.addEventListener('click',e=>{const b=e.target.closest('button,[data-act]');if(!b)return;
if(b.hasAttribute('data-tip')){tipPercent=+b.dataset.tip;customTip=null;paint();return}
if(b.hasAttribute('data-method')){method=b.dataset.method;open(method==='codi'?'phone':(method==='cash'||method==='terminal')?'offline':'confirm');return}
if(b.hasAttribute('data-split')){const v=b.dataset.split;if(v==='items'){mode='items';itemIds=new Set();open('items');return}if(v==='custom'){mode='custom';custom='';open('custom');return}mode=v.startsWith('eq')?'equal':'all';parts=v.startsWith('eq')?Number(v.slice(2)):2;close();return}
if(b.hasAttribute('data-item'))return;
const action=b.dataset.act;switch(action){
case'ticket':open('ticket');break;case'split':open('split');break;case'customTip':open('tipcustom');break;
case'pay':if(base()>0)open('method');break;case'close':close();break;
case'applyItems':if(base()>0)close();break;
case'applyCustom':if(Number(custom)>0&&Number(custom)<=available())close();else{error='Elige un monto entre $1 y '+money(available());paint()}break;
case'applyTip':if(customTip!==null&&customTip>=0)close();break;
case'request':if(/^\d{10}$/.test(phone))open('confirm');else{error='Ingresa un número de 10 dígitos.';paint()}break;
case'confirm':finishDigital();break;case'offlineRequest':startOffline();break;
case'toProfile':toProfile();break;case'guestContinue':toProfile();break;
case'loyalty':stopVisitTimer();visitAutoOpened=true;open('loyalty');break;case'saveVisit':case'identity':open('identity');break;
case'declineVisit':declineVisit();break;case'authApple':case'authPhone':open('authUnavailable');break;
case'visitDetail':open('visitDetail');break;
case'cancelPending':{const p=currentPayment();if(p?.status==='pending')cancelOffline(p.id);else goHome();break}
case'staffConfirm':confirmOffline(b.dataset.id);break;case'staffCancel':cancelOffline(b.dataset.id);break;
case'toCheckout':goHome();break;case'clearAll':clearEverything();break;
}}
);
app.addEventListener('change',e=>{const x=e.target;if(x.dataset.item!==undefined){const id=Number(x.dataset.item);if(x.checked)itemIds.add(id);else itemIds.delete(id);const t=app.querySelector('#itemTotal');if(t)t.textContent=money(base());const apply=app.querySelector('[data-act="applyItems"]');if(apply)apply.disabled=base()<=0;}});
app.addEventListener('input',e=>{const x=e.target;switch(x.dataset.input){case'custom':custom=x.value;break;case'customTip':customTip=Math.max(0,Number(x.value)||0);break;case'phone':phone=x.value.replace(/\D/g,'').slice(0,10);x.value=phone;break}});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&sheet)close()});
window.addEventListener('storage',e=>{if(e.key!==KEY)return;try{const x=JSON.parse(e.newValue);if(!x?.payments)return;store=x;if(page==='waiting'&&currentPayment()?.status==='confirmed'){page='success';paint();beginVisitTimer()}else paint()}catch{}});
paint();
})();

</script>
</body>
</html>
