<!doctype html>
<html lang="es-MX">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
<meta name="theme-color" content="#FDFEF4" />
<title>Tu cuenta · Bodegón San Agustín</title>
<meta name="description" content="Paga o divide tu cuenta en Bodegón San Agustín." />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@400;500;600;700;800&family=Instrument+Serif&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet" />
<style>
:root{--paper:#FDFEF4;--ink:#1B1815;--blue:#1224F4;--muted:rgba(27,24,21,.50);--subtle:rgba(27,24,21,.68);--hair:rgba(27,24,21,.115);--ease:cubic-bezier(.22,1,.36,1)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html{background:var(--paper)}body{margin:0;background:linear-gradient(180deg,#FDFEF4 0%,#F6F7EE 100%);color:var(--ink);font-family:'Hanken Grotesk',-apple-system,BlinkMacSystemFont,'Helvetica Neue',Arial,sans-serif;-webkit-font-smoothing:antialiased;min-height:100dvh}button,input{font:inherit}button{cursor:pointer}button:focus-visible,input:focus-visible{outline:2px solid var(--blue);outline-offset:3px}button:disabled{opacity:.3;cursor:not-allowed}.app{min-height:100dvh;max-width:478px;display:flex;flex-direction:column;margin:auto;position:relative}.top{display:flex;align-items:center;justify-content:space-between;padding:calc(18px + env(safe-area-inset-top)) 26px 14px}.logo{font-size:21px;font-weight:800;letter-spacing:-.09em}.topright{font-size:12px;font-weight:600;color:var(--subtle)}.screen{flex:1;display:flex;flex-direction:column;padding:15px 26px 0}.merchant{display:flex;align-items:center;gap:13px;margin:8px 0 29px}.monogram{width:41px;height:41px;border-radius:50%;border:1px solid rgba(27,24,21,.20);display:grid;place-items:center;font:27px 'Instrument Serif',Georgia,serif}.merchantName{font-size:15px;font-weight:700;letter-spacing:-.027em}.merchantSub{color:var(--muted);font-size:12px;margin-top:3px}.eyebrow{font-size:10.5px;font-weight:700;letter-spacing:.145em;text-transform:uppercase;color:var(--muted)}.hero{font-size:clamp(55px,14vw,71px);font-weight:800;letter-spacing:-.079em;line-height:1.04;font-variant-numeric:tabular-nums;margin:10px 0 3px;white-space:nowrap}.hero .cent{font-size:.43em;color:rgba(27,24,21,.31);font-weight:600;letter-spacing:-.048em}.paidbar{height:3px;background:rgba(27,24,21,.085);border-radius:9px;overflow:hidden;margin:22px 0 0}.paidbar span{display:block;background:var(--blue);height:100%;transition:width .4s var(--ease)}.ticketLink{background:transparent;border:0;display:flex;justify-content:space-between;align-items:center;color:var(--subtle);font-size:12.5px;padding:15px 0;width:100%;text-align:left}.ticketLink strong{font-weight:650;color:var(--ink)}.hair{height:1px;background:var(--hair)}.part{display:flex;align-items:center;justify-content:space-between;padding:25px 0 20px;gap:10px}.partTitle{font-size:14px;font-weight:700;letter-spacing:-.02em}.partSub{font-size:13px;color:var(--muted);margin-top:5px}.textAction{background:none;border:0;color:var(--blue);font-size:13px;font-weight:700;padding:12px 0 12px 16px;white-space:nowrap}.tips{padding-top:24px}.sectionHead{display:flex;align-items:baseline;gap:8px;justify-content:space-between}.sectionTitle{font-size:15px;font-weight:700;letter-spacing:-.025em}.sectionHint{font-size:12px;color:var(--muted)}.tipsGrid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px;margin-top:17px}.tip{height:54px;border:1px solid var(--hair);background:transparent;color:var(--ink);border-radius:18px;font-size:14px;font-weight:700}.tip[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:var(--paper)}.customTip{border:none;background:transparent;color:var(--subtle);text-decoration:underline;text-underline-offset:4px;text-decoration-color:rgba(27,24,21,.35);font-size:12px;padding:14px 0 0;display:block}.paybar{margin-top:auto;padding:29px 26px calc(21px + env(safe-area-inset-bottom));background:linear-gradient(180deg,rgba(250,251,242,0) 0%,rgba(248,249,240,.94) 16%,#F8F9F0 100%)}.total{display:flex;align-items:flex-end;justify-content:space-between;margin-bottom:17px}.total span{font-size:13px;color:var(--subtle)}.total strong{font-size:25px;letter-spacing:-.048em;font-variant-numeric:tabular-nums}.primary{background:var(--ink);color:var(--paper);border:0;border-radius:999px;min-height:62px;width:100%;display:flex;justify-content:center;align-items:center;gap:9px;padding:0 16px;font-size:16px;font-weight:700;letter-spacing:-.017em;transition:transform .2s var(--ease)}.primary:active{transform:scale(.983)}.secondary{border:0;background:transparent;color:var(--subtle);width:100%;min-height:48px;font-weight:600;font-size:13px}.primary svg{width:20px;height:20px;stroke:currentColor}.sheetScrim{position:fixed;inset:0;background:rgba(27,24,21,.36);backdrop-filter:blur(3px);-webkit-backdrop-filter:blur(3px);z-index:20;animation:fade .18s ease both}.sheet{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:min(100%,478px);max-height:min(88dvh,850px);display:flex;flex-direction:column;overflow:hidden;border-radius:34px 34px 0 0;background:rgba(253,254,244,.97);backdrop-filter:blur(35px) saturate(1.2);-webkit-backdrop-filter:blur(35px) saturate(1.2);z-index:21;box-shadow:0 -18px 50px rgba(27,24,21,.12);animation:up .33s var(--ease) both}.sheetHead{padding:15px 26px 8px;display:flex;align-items:center;justify-content:space-between;min-height:56px}.grab{height:5px;width:36px;position:absolute;top:10px;left:calc(50% - 18px);background:rgba(27,24,21,.15);border-radius:99px}.close{background:transparent;border:0;font-size:25px;line-height:1;padding:9px;min-width:40px;text-align:right;color:var(--subtle)}.sheetBody{padding:0 26px 16px;overflow:auto;min-height:0}.sheetFoot{padding:12px 26px calc(22px + env(safe-area-inset-bottom));flex-shrink:0}.sheetTitle{font-size:28px;line-height:1.08;letter-spacing:-.046em;font-weight:700;margin:10px 0 15px}.sheetDesc{font-size:13px;line-height:1.6;color:var(--subtle);margin:0 0 14px}.choice{width:100%;display:flex;align-items:center;gap:13px;padding:19px 0;text-align:left;background:transparent;border:0;border-bottom:1px solid var(--hair);min-height:65px}.choice strong{font-size:15px;font-weight:700;letter-spacing:-.02em;flex:1}.choice span{font-size:13px;color:var(--subtle)}.choice .arrow{font-size:22px;color:var(--muted)}.choice:last-child{border:0}.choiceIcon{width:39px;height:39px;border-radius:13px;border:1px solid var(--hair);display:grid;place-items:center;flex:none}.choiceIcon svg{height:19px;width:19px;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}.fieldTitle{font-size:12px;color:var(--muted);font-weight:650;margin-top:28px}.field{width:100%;border:none;border-bottom:1px solid rgba(27,24,21,.28);background:transparent;font-size:34px;font-weight:700;letter-spacing:-.035em;color:var(--ink);height:64px;outline:none;border-radius:0;margin-top:4px}.field:focus{border-color:var(--blue)}.error{font-size:12px;color:#A43E35;margin-top:8px}.items{margin:8px 0 0}.item{min-height:52px;border-bottom:1px solid var(--hair);display:flex;gap:13px;align-items:center}.item input{width:22px;height:22px;accent-color:var(--ink);flex:none}.itemName{font-size:13px;flex:1}.itemAmount{font-size:13px;font-variant-numeric:tabular-nums;font-weight:650}.sheetTotal{display:flex;justify-content:space-between;align-items:baseline;padding:12px 0 2px}.sheetTotal span{font-size:13px;color:var(--subtle)}.sheetTotal strong{font-size:23px;font-variant-numeric:tabular-nums;letter-spacing:-.035em}.confirmation{padding:14px 0 6px;border-top:1px solid var(--hair);margin-top:14px}.confirmRow{display:flex;justify-content:space-between;align-items:baseline;padding:8px 0;font-size:13px}.confirmRow span{color:var(--subtle)}.confirmRow strong{font-variant-numeric:tabular-nums}.safety{font-size:11px;line-height:1.5;color:var(--muted);text-align:center;margin:12px 0 0}.success{padding-top:43px}.doneMark{width:62px;height:62px;border:2px solid var(--ink);border-radius:50%;display:grid;place-items:center}.doneMark svg{height:31px;width:31px;fill:none;stroke:var(--ink);stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}.doneTitle{font-size:43px;line-height:1.05;letter-spacing:-.06em;margin:23px 0 13px}.doneSub{font-size:15px;line-height:1.6;color:var(--subtle);margin:0}.saved{margin-top:37px;border-top:1px solid var(--hair);padding:24px 0;display:flex;align-items:center;justify-content:space-between;gap:14px}.saved strong{font-size:15px}.saved p{font-size:12px;color:var(--muted);margin:5px 0 0}.linkArrow{border:0;background:transparent;color:var(--blue);font-size:13px;font-weight:700;padding:14px 0}.minNote{font-size:11px;color:var(--muted);line-height:1.5}.detailList{margin-top:15px}.detailItem{display:flex;justify-content:space-between;gap:14px;border-bottom:1px solid var(--hair);padding:13px 0;font-size:12px}.detailItem span:last-child{font-weight:700}.staffKpi{display:flex;justify-content:space-between;gap:10px;margin-top:21px}.staffKpi>div{flex:1}.staffKpi strong{display:block;font-size:27px;letter-spacing:-.04em;margin-top:8px}.staffLog{margin-top:24px}.staffLog .detailItem{font-size:12px}.serif{font-family:'Instrument Serif',Georgia,serif;font-size:37px;letter-spacing:-.02em;font-weight:400}.overline{font-size:10px;letter-spacing:.14em;text-transform:uppercase;font-weight:700;color:var(--muted)}.staffHeader{display:flex;justify-content:space-between;align-items:center}.staffHeader button{background:none;border:0;color:var(--blue);font-size:13px;padding:12px 0}.muted{color:var(--muted)}
@keyframes up{from{transform:translate(-50%,105%)}to{transform:translate(-50%,0)}}@keyframes fade{from{opacity:0}to{opacity:1}}@media(prefers-reduced-motion:reduce){*,*:before,*:after{animation-duration:0.01ms!important;transition-duration:0.01ms!important}}
@media(min-width:560px){.app{border-left:1px solid var(--hair);border-right:1px solid var(--hair)}}@media(max-width:365px){.top{padding-left:21px;padding-right:21px}.screen{padding-left:21px;padding-right:21px}.paybar{padding-left:21px;padding-right:21px}.hero{font-size:54px}.tipsGrid{gap:6px}.tip{height:48px}}
</style>
</head>
<body>
<div id="app" class="app"></div>
<script>
(()=>{'use strict';
const ticket=[
['Servicio de mesa',0],['Agua mineral 355ml',65],['Vaso chelado',25],['Clamato preparado',95],['Cerveza XX Lager 355ml',70],['Vodka Stolichnaya 750ml',120],['Pincho de alitas',185],['Cerveza XX Lager 355ml',70],['Ensalada de la casa',445],['Pollo orgánico bodegonero',595],['Vaso chelado',25],['Agua mineral 355ml',65],['Carajillo',190]
].map(([name,price],id)=>({id,name,price}));
const FULL=1950,KEY='voraa-bodegon-14-compact-v2',app=document.getElementById('app');
let ledger=[];try{ledger=JSON.parse(localStorage.getItem(KEY))?.payments||[]}catch{};
if(!Array.isArray(ledger))ledger=[];
let page=new URLSearchParams(location.search).has('staff')?'staff':'checkout',sheet='',mode='all',parts=2,custom='',tipPercent=0,customTip=null,method='wallet',itemIds=new Set(),phone='',loyalty=false,error='';
function money(n){return '$'+(Math.round(n*100)/100).toLocaleString('es-MX',{minimumFractionDigits:2,maximumFractionDigits:2})}
function hero(n){const [i,d]=money(n).split('.');return `${i}<span class="cent">.${d}</span>`}
function paid(){return Math.round(ledger.reduce((s,x)=>s+x.base,0)*100)/100}
function remaining(){return Math.max(0,Math.round((FULL-paid())*100)/100)}
function usedItems(){return new Set(ledger.flatMap(x=>x.items||[]))}
function remainingItems(){let u=usedItems();return ticket.filter(x=>!u.has(x.id))}
function base(){const r=remaining();if(mode==='equal')return Math.min(r,Math.round(FULL/parts*100)/100);if(mode==='custom')return Math.min(r,Math.max(0,Number(custom)||0));if(mode==='items')return Math.min(r,ticket.filter(x=>itemIds.has(x.id)).reduce((s,x)=>s+x.price,0));return r}
function tip(){return Math.round((customTip!==null?customTip:base()*tipPercent/100)*100)/100}
function total(){return Math.round((base()+tip())*100)/100}
function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function icon(name){const paths={check:'<path d="M5 12.5l4.5 4.5L19 7.5"/>',arrow:'<path d="M6 12h12m-5-5 5 5-5 5"/>',card:'<rect x="2.5" y="5" width="19" height="14" rx="2"/><path d="M2.5 10h19"/>',bank:'<path d="M3 10h18M4 10l8-6 8 6M5 10v9m5-9v9m4-9v9m5-9v9M3 20h18"/>',terminal:'<rect x="5" y="2.5" width="14" height="19" rx="3"/><path d="M9 7h6M9 12h6M12 17h.01"/>',split:'<path d="M4 7h6l4 5h6M4 17h6l4-5h6"/>',wallet:'<path d="M3 7h18v14H3zM3 7V5a2 2 0 012-2h13v4M16 15h5"/>'};return `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" aria-hidden="true">${paths[name]||paths.check}</svg>`}
function persist(){try{localStorage.setItem(KEY,JSON.stringify({payments:ledger}))}catch{}}
function resetPortion(){mode='all';parts=2;custom='';tipPercent=0;customTip=null;method='wallet';itemIds=new Set();phone='';error=''}
function summaryPortion(){if(mode==='equal')return `1 de ${parts} partes`;if(mode==='items')return `${itemIds.size} ${itemIds.size===1?'artículo':'artículos'}`;if(mode==='custom')return 'Monto elegido';return 'Cuenta completa'}
function header(){return `<header class="top"><div class="logo">voraa</div><div class="topright">Mesa 14</div></header>`}
function checkout(){const r=remaining();if(r===0)return paidAll();return `${header()}<main class="screen"><div class="merchant"><div class="monogram">B</div><div><div class="merchantName">Bodegón San Agustín</div><div class="merchantSub">Mesa 14 · Obed M.</div></div></div><div class="eyebrow">Saldo de la cuenta</div><h1 class="hero">${hero(r)}</h1>${paid()>0?`<div class="paidbar"><span style="width:${100*paid()/FULL}%"></span></div><div class="merchantSub" style="margin-top:9px">${money(paid())} de ${money(FULL)} cubiertos</div>`:''}<button class="ticketLink" data-act="ticket"><span>Tu ticket · 13 artículos</span><strong>Ver detalle ↗</strong></button><div class="hair"></div><section class="part"><div><div class="partTitle">Tu parte · ${money(base())}</div><div class="partSub">${summaryPortion()}</div></div><button class="textAction" data-act="split">Dividir ↗</button></section><div class="hair"></div><section class="tips"><div class="sectionHead"><div class="sectionTitle">Propina</div><span class="sectionHint">Para Obed y el equipo</span></div><div class="tipsGrid">${[0,10,15,20].map(p=>`<button class="tip" aria-pressed="${tipPercent===p&&customTip===null}" data-tip="${p}">${p===0?'Sin':p+'%'}</button>`).join('')}</div><button class="customTip" data-act="customTip">Otro importe</button></section></main><footer class="paybar"><div class="total"><span>Total a pagar</span><strong>${money(total())}</strong></div><button class="primary" data-act="pay">${method==='wallet'?'Pagar con Apple Pay':method==='card'?'Continuar con tarjeta':method==='codi'?'Pagar con CoDi':'Pedir terminal'}</button><button class="secondary" data-act="method">${method==='wallet'?'Otras formas de pago':`Método: ${method==='card'?'Tarjeta':method==='codi'?'CoDi':'Terminal'} · Cambiar`}</button></footer>`}
function paidAll(){return `${header()}<main class="screen success"><div class="doneMark">${icon('check')}</div><h1 class="doneTitle">Cuenta cubierta.</h1><p class="doneSub">Mesa 14 · Bodegón San Agustín</p><div class="confirmation"><div class="confirmRow"><span>Total de la cuenta</span><strong>${money(FULL)}</strong></div><div class="confirmRow"><span>Movimientos</span><strong>${ledger.length}</strong></div></div><div class="saved"><div><strong>Un buen lugar para volver.</strong><p>Guarda tu visita si quieres.</p></div><button class="linkArrow" data-act="loyalty">Guardar ↗</button></div><div class="minNote">Los pagos de este recorrido no se procesaron realmente.</div></main><footer class="paybar"><button class="secondary" data-act="restart">Volver a empezar</button></footer>`}
function success(){const last=ledger.at(-1);return `${header()}<main class="screen success"><div class="doneMark">${icon('check')}</div><h1 class="doneTitle">Gracias por venir.</h1><p class="doneSub">Tu parte de ${money(last?.base||0)} quedó registrada.<br>Bodegón San Agustín · Mesa 14</p><div class="confirmation" style="margin-top:33px"><div class="confirmRow"><span>Propina</span><strong>${money(last?.tip||0)}</strong></div><div class="confirmRow"><span>Saldo de la mesa</span><strong>${money(remaining())}</strong></div></div><div class="saved"><div><strong>¿Guardamos tu visita?</strong><p>Es opcional. Te recordamos cuando vuelvas.</p></div><button class="linkArrow" data-act="loyalty">Guardar ↗</button></div><div class="minNote">No se realizó ningún cargo real.</div></main><footer class="paybar"><button class="primary" data-act="another">${remaining()>0?'Otra persona paga':'Listo'}</button></footer>`}
function staff(){const totalTips=ledger.reduce((s,x)=>s+x.tip,0);return `${header()}<main class="screen"><div class="staffHeader"><div class="overline">Restaurante</div><button data-act="toCheckout">Ver cuenta ↗</button></div><h1 class="doneTitle" style="margin-top:16px">Mesa 14</h1><p class="doneSub">Bodegón San Agustín · Obed M.</p><div class="staffKpi"><div><div class="overline">Cubierto</div><strong>${money(paid())}</strong></div><div><div class="overline">Pendiente</div><strong>${money(remaining())}</strong></div></div><div class="paidbar" style="margin-top:25px"><span style="width:${100*paid()/FULL}%"></span></div><div class="staffLog"><div class="overline">Movimientos</div>${ledger.length?ledger.map((t,i)=>`<div class="detailItem"><span>${i+1}. ${esc(t.method)}<br><small class="muted">${esc(t.when)} · Propina ${money(t.tip)}</small></span><span>${money(t.base+t.tip)}</span></div>`).join(''):'<p class="sheetDesc" style="margin-top:18px">Todavía no hay pagos registrados.</p>'}<div class="detailItem"><span>Total de propinas</span><span>${money(totalTips)}</span></div></div><p class="minNote" style="margin-top:25px">Los movimientos se guardan solo en este navegador. No se sincronizan con el POS ni con el banco.</p></main><footer class="paybar"><button class="primary" data-act="toCheckout">Ver cuenta</button><button class="secondary" data-act="clearAll">Reiniciar mesa</button></footer>`}
function sheetHtml(){if(!sheet)return '';let b='',f='';if(sheet==='split'){b=`<div class="sheetTitle">¿Cómo dividimos la cuenta?</div><p class="sheetDesc">Cada persona elige su parte y paga como prefiera.</p>${[['all','Cuenta completa',money(remaining())],['eq2','Entre 2','Mitad de la cuenta'],['eq3','Entre 3','Un tercio'],['eq4','Entre 4','Un cuarto'],['items','Por platillos','Elige lo que consumiste'],['custom','Otro monto','Escribe cuánto pagar']].map(([key,title,sub])=>`<button class="choice" data-split="${key}"><strong>${title}</strong><span>${sub}</span><span class="arrow">›</span></button>`).join('')}`}
else if(sheet==='items'){let used=usedItems();b=`<div class="sheetTitle">Tus platillos.</div><p class="sheetDesc">Elige los que vas a pagar.</p><div class="items">${ticket.map(x=>`<label class="item" style="${used.has(x.id)?'opacity:.28':''}"><input type="checkbox" data-item="${x.id}" ${itemIds.has(x.id)?'checked':''} ${used.has(x.id)?'disabled':''}><span class="itemName">${esc(x.name)}</span><span class="itemAmount">${money(x.price)}</span></label>`).join('')}</div><div class="sheetTotal"><span>Tu parte</span><strong id="itemTotal">${money(base())}</strong></div>`;f=`<button class="primary" data-act="applyItems" ${base()<=0?'disabled':''}>Elegir esta parte</button>`}
else if(sheet==='custom'){b=`<div class="sheetTitle">Tu parte.</div><p class="sheetDesc">¿Cuánto de la cuenta quieres cubrir?</p><div class="fieldTitle">Importe en pesos</div><input class="field" data-input="custom" inputmode="decimal" type="number" min="1" max="${remaining()}" step=".01" placeholder="0.00" value="${esc(custom)}"><div class="minNote" style="margin-top:13px">Pendiente de la mesa: ${money(remaining())}</div><div class="error" id="customError">${esc(error)}</div>`;f=`<button class="primary" data-act="applyCustom">Elegir monto</button>`}
else if(sheet==='tipcustom'){b=`<div class="sheetTitle">Otra propina.</div><p class="sheetDesc">El importe se añade solo a tu parte.</p><div class="fieldTitle">Propina en pesos</div><input class="field" data-input="customTip" inputmode="decimal" type="number" min="0" step=".01" placeholder="0.00" value="${customTip===null?'':customTip}">`;f=`<button class="primary" data-act="applyTip">Guardar propina</button>`}
else if(sheet==='method'){b=`<div class="sheetTitle">¿Cómo quieres pagar?</div>${[['wallet','Apple Pay','wallet'],['card','Tarjeta de crédito o débito','card'],['terminal','Terminal del mesero','terminal'],['codi','CoDi · desde tu banco','bank']].map(([key,title,ico])=>`<button class="choice" data-method="${key}"><span class="choiceIcon">${icon(ico)}</span><strong>${title}</strong><span>${method===key?'✓':'›'}</span></button>`).join('')}`}
else if(sheet==='confirm'){const label={wallet:'Apple Pay',card:'Tarjeta',codi:'CoDi',terminal:'Terminal'}[method];b=`<div class="overline" style="margin-top:18px">Bodegón San Agustín</div><div class="sheetTitle" style="font-size:39px;margin-top:17px">${money(total())}</div><p class="sheetDesc">${label}</p><div class="confirmation"><div class="confirmRow"><span>Tu consumo</span><strong>${money(base())}</strong></div><div class="confirmRow"><span>Propina</span><strong>${money(tip())}</strong></div></div><div class="safety">No se realizará ningún cargo real.</div>`;f=`<button class="primary" data-act="confirm">Confirmar</button>`}
else if(sheet==='phone'){b=`<div class="sheetTitle">Paga desde tu banco.</div><p class="sheetDesc">Ingresa el celular registrado en CoDi para recibir una solicitud de cobro.</p><div class="fieldTitle">Número celular</div><input class="field" data-input="phone" type="tel" inputmode="numeric" maxlength="10" placeholder="81 0000 0000" value="${esc(phone)}"><div class="error" id="phoneError">${esc(error)}</div><div class="safety">No se enviará una solicitud bancaria en este recorrido.</div>`;f=`<button class="primary" data-act="request">Continuar</button>`}
else if(sheet==='terminal'){b=`<div class="sheetTitle">¿Prefieres la terminal?</div><p class="sheetDesc">Pídele a Obed que te traiga la terminal. Puedes pagar con tu tarjeta como siempre.</p><p class="minNote">Esta opción no registra automáticamente el pago de la mesa.</p>`;f=`<button class="primary" data-act="close">Entendido</button>`}
else if(sheet==='ticket'){b=`<div class="sheetTitle">Tu ticket.</div><div class="sheetDesc">Bodegón San Agustín · Mesa 14</div><div class="detailList">${ticket.map(x=>`<div class="detailItem"><span>${esc(x.name)}</span><span>${money(x.price)}</span></div>`).join('')}<div class="detailItem" style="font-size:15px;font-weight:700"><span>Total</span><span>${money(FULL)}</span></div></div>`}
else if(sheet==='loyalty'){b=`<div class="sheetTitle serif">Los buenos lugares se repiten.</div><p class="sheetDesc">Guarda esta visita en tu tarjeta de Bodegón. Sin crear otra cuenta.</p><div style="display:flex;gap:9px;margin-top:30px">${[0,1,2,3,4].map((v)=>`<div style="width:44px;height:44px;display:grid;place-items:center;border-radius:50%;border:1px solid ${v===0?'var(--blue)':'var(--hair)'};color:${v===0?'var(--blue)':'rgba(27,24,21,.18)'};font-size:22px">${v===0?'★':'·'}</div>`).join('')}</div><div class="minNote" style="margin-top:17px">Tu visita se conservará en este dispositivo. No se enviarán mensajes ni se registrará tu teléfono.</div>`;f=`<button class="primary" data-act="saveVisit">Guardar mi visita</button>`}
else if(sheet==='visitSaved'){b=`<div class="sheetTitle">Visita guardada.</div><p class="sheetDesc">Bodegón San Agustín · 1 visita</p>`;f=`<button class="primary" data-act="close">Listo</button>`}
return `<div class="sheetScrim" data-act="close" aria-hidden="true"></div><section class="sheet" role="dialog" aria-modal="true" aria-label="Opciones de la cuenta"><span class="grab"></span><div class="sheetHead"><span></span><button class="close" data-act="close" aria-label="Cerrar">×</button></div><div class="sheetBody">${b}</div>${f?`<div class="sheetFoot">${f}</div>`:''}</section>`}
function paint(){app.innerHTML=(page==='staff'?staff():page==='success'?success():checkout())+sheetHtml();document.body.style.overflow=sheet?'hidden':'';if(sheet==='phone')app.querySelector('[data-input="phone"]')?.focus();}
function open(s){sheet=s;error='';paint()}
function close(){sheet='';error='';paint()}
function finish(){if(!(base()>0)||base()>remaining()||ledger.length>40){return}ledger.push({base:base(),tip:tip(),method:{wallet:'Apple Pay',card:'Tarjeta',codi:'CoDi',terminal:'Terminal'}[method],items:mode==='items'?[...itemIds]:[],when:new Date().toLocaleTimeString('es-MX',{hour:'2-digit',minute:'2-digit'})});persist();sheet='';page='success';paint();window.scrollTo(0,0)}
function goHome(){page='checkout';resetPortion();sheet='';paint();window.scrollTo(0,0)}
app.addEventListener('click',e=>{const b=e.target.closest('button,[data-act]');if(!b)return;
if(b.hasAttribute('data-tip')){tipPercent=+b.dataset.tip;customTip=null;paint();return}
if(b.hasAttribute('data-method')){method=b.dataset.method;close();return}
if(b.hasAttribute('data-split')){const v=b.dataset.split;if(v==='items'){mode='items';itemIds=new Set();open('items');return}if(v==='custom'){mode='custom';custom='';open('custom');return}mode=v.startsWith('eq')?'equal':'all';parts=v.startsWith('eq')?Number(v.slice(2)):2;close();return}
const a=b.dataset.act;switch(a){case'ticket':open('ticket');break;case'split':open('split');break;case'customTip':open('tipcustom');break;case'method':open('method');break;case'pay':if(!(base()>0))return;open(method==='codi'?'phone':method==='terminal'?'terminal':'confirm');break;case'close':close();break;case'applyItems':if(base()>0){close()}break;case'applyCustom':if(Number(custom)>0&&Number(custom)<=remaining()){close()}else{error='Elige un monto entre $1 y '+money(remaining());paint()}break;case'applyTip':if(customTip!==null&&customTip>=0)close();break;case'request':if(/^\d{10}$/.test(phone))open('confirm');else{error='Ingresa un número de 10 dígitos.';paint()}break;case'confirm':finish();break;case'another':goHome();break;case'loyalty':open('loyalty');break;case'saveVisit':loyalty=true;open('visitSaved');break;case'restart':case'clearAll':ledger=[];persist();goHome();break;case'toCheckout':page='checkout';paint();break;}}
);
app.addEventListener('input',e=>{const el=e.target;const type=el.dataset.input;if(type==='custom'){custom=el.value;return}if(type==='customTip'){customTip=Math.max(0,Number(el.value)||0);return}if(type==='phone'){phone=el.value.replace(/\D/g,'').slice(0,10);el.value=phone;return}if(el.hasAttribute('data-item')){const id=+el.dataset.item;if(el.checked)itemIds.add(id);else itemIds.delete(id);const t=app.querySelector('#itemTotal');if(t)t.textContent=money(base());const p=app.querySelector('[data-act="applyItems"]');if(p)p.disabled=base()<=0;}});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&sheet)close()});paint();
})();
</script>
</body>
</html>
