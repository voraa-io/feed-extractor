<!doctype html>
<html lang="es-MX">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#FDFEF4">
<title>Tu cuenta · Bodegón San Agustín | Voraa</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@400;500;600;700;800&family=Instrument+Serif&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{--paper:#FDFEF4;--ink:#1B1815;--blue:#1224F4;--line:rgba(27,24,21,.11);--muted:rgba(27,24,21,.53);--quiet:rgba(27,24,21,.035);--ease:cubic-bezier(.22,1,.36,1)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html{min-height:100%;background:var(--paper)}body{margin:0;color:var(--ink);font-family:'Hanken Grotesk',-apple-system,BlinkMacSystemFont,'Helvetica Neue',sans-serif;background:linear-gradient(165deg,#FDFEF4 0%,#F5F6EC 100%);min-height:100dvh}button,input{font:inherit}button{cursor:pointer}button:focus-visible,input:focus-visible{outline:2px solid var(--blue);outline-offset:3px}button:disabled{opacity:.35;cursor:not-allowed}.app{max-width:490px;margin:0 auto;min-height:100dvh;display:flex;flex-direction:column;position:relative}.top{display:flex;align-items:center;justify-content:space-between;padding:calc(21px + env(safe-area-inset-top)) 27px 17px;min-height:calc(78px + env(safe-area-inset-top));gap:8px}.wordmark{font-weight:800;font-size:19px;letter-spacing:-.075em}.tiny{font-size:12px;line-height:1.4;color:var(--muted)}.demo{border:1px solid var(--line);border-radius:999px;padding:5px 10px;font-size:10px;letter-spacing:.1em;font-weight:700;text-transform:uppercase;color:rgba(27,24,21,.55)}.back{border:0;background:transparent;padding:8px 8px 8px 0;font-size:25px;line-height:1;width:40px;text-align:left}.screen{flex:1;min-height:0;display:flex;flex-direction:column;padding:7px 27px 28px;animation:rise .34s var(--ease) both}.content{flex:1;min-height:0}.bottom{padding-top:28px;padding-bottom:calc(5px + env(safe-area-inset-bottom))}.btn{border:0;display:flex;align-items:center;justify-content:center;gap:10px;width:100%;min-height:60px;background:var(--ink);color:var(--paper);font-size:16px;font-weight:700;letter-spacing:-.008em;border-radius:999px;transition:transform .2s var(--ease),opacity .2s}.btn:active{transform:scale(.985)}.link{border:0;background:transparent;padding:13px 8px;color:var(--muted);font-weight:600;font-size:13px;width:100%;text-align:center}.micro{font-size:10px;letter-spacing:.16em;text-transform:uppercase;font-weight:700;color:rgba(27,24,21,.47)}.serif{font-family:'Instrument Serif',Georgia,serif;font-size:29px;letter-spacing:-.012em;font-weight:400}.head{font-size:33px;line-height:1.06;font-weight:700;letter-spacing:-.048em;margin:15px 0 9px;max-width:350px}.desc{font-size:14px;line-height:1.6;color:var(--muted);max-width:390px;margin:0 0 23px}.place{display:flex;align-items:center;gap:12px;margin-bottom:20px}.round{width:36px;height:36px;border:1px solid var(--line);border-radius:50%;display:flex;align-items:center;justify-content:center;font-family:'Instrument Serif',serif;font-size:24px;color:rgba(27,24,21,.7)}.place strong{font-size:14.5px;letter-spacing:-.02em}.hero{font-size:66px;font-weight:800;letter-spacing:-.071em;line-height:1;white-space:nowrap;tabular-nums:1;font-variant-numeric:tabular-nums}.hero sup{font-size:.5em;font-weight:600;color:var(--muted);vertical-align:baseline}.hero .cents{font-size:.46em;font-weight:600;color:rgba(27,24,21,.31);letter-spacing:-.055em}.hero-label{margin-top:30px;margin-bottom:12px}.line{border-top:1px solid var(--line)}.detailRow{display:flex;justify-content:space-between;gap:14px;align-items:baseline;padding:16px 0;font-size:14px;border-bottom:1px solid var(--line)}.detailRow>span{color:var(--muted)}.detailRow strong{font-weight:700;font-variant-numeric:tabular-nums}.detailRow button{border:0;background:transparent;color:inherit;font-size:13px;font-weight:700;text-decoration:underline;text-decoration-color:rgba(27,24,21,.3);text-underline-offset:4px;padding:3px 0}.outline{width:100%;border:1px solid var(--line);background:rgba(255,255,255,.38);border-radius:18px;min-height:69px;padding:17px 18px;display:flex;align-items:center;text-align:left;gap:14px;color:var(--ink);margin-top:10px}.outline.sel{border-color:var(--ink);background:rgba(255,255,255,.78)}.dot{width:23px;height:23px;border:1.5px solid rgba(27,24,21,.3);border-radius:50%;display:grid;place-items:center;flex:none}.sel .dot{border-color:var(--ink);background:var(--ink);color:white}.dot svg{width:13px;height:13px}.grow{flex:1}.optTitle{font-size:15px;font-weight:700;letter-spacing:-.02em}.optSub{font-size:12.5px;color:var(--muted);line-height:1.4;margin-top:3px}.value{font-size:15px;font-weight:700;font-variant-numeric:tabular-nums;white-space:nowrap}.seg{display:flex;gap:7px;background:rgba(27,24,21,.055);padding:5px;border-radius:19px}.seg>button{flex:1;border:0;border-radius:14px;background:transparent;min-height:43px;font-size:13px;font-weight:700;color:var(--muted)}.seg>button.active{background:white;color:var(--ink);box-shadow:0 2px 7px rgba(27,24,21,.08)}.meter{height:5px;background:rgba(27,24,21,.09);border-radius:20px;overflow:hidden;margin:14px 0 8px}.meter>div{height:100%;background:var(--ink);border-radius:20px;transition:width .25s}.stepper{margin-top:26px;border-top:1px solid var(--line);padding-top:23px;display:flex;align-items:center;justify-content:space-between}.stepperBtns{display:flex;align-items:center;gap:14px}.circleBtn{border:1px solid var(--line);background:rgba(255,255,255,.7);width:42px;height:42px;border-radius:50%;font-size:22px;font-weight:400;display:grid;place-items:center}.stepNum{font-size:18px;font-weight:700;width:26px;text-align:center}.input{width:100%;height:66px;border:0;background:transparent;border-bottom:1px solid rgba(27,24,21,.33);border-radius:0;font-size:35px;font-weight:700;letter-spacing:-.04em;color:var(--ink);outline:0}.input:focus{border-color:var(--blue)}.itemlist{max-height:315px;overflow:auto;scrollbar-width:thin;margin-top:14px}.item{display:flex;gap:14px;align-items:center;padding:13px 0;border-bottom:1px solid var(--line);min-height:57px}.item input{appearance:none;border:1.5px solid rgba(27,24,21,.37);width:22px;height:22px;border-radius:50%;flex:none;margin:0;position:relative}.item input:checked{background:var(--ink);border-color:var(--ink)}.item input:checked:after{content:'✓';color:white;position:absolute;top:-2px;left:4px;font-size:16px}.item .t{font-size:13px;flex:1}.item .p{font-size:13px;font-weight:700;font-variant-numeric:tabular-nums}.item.paid{opacity:.38}.tipgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:24px}.tipBtn{border:1px solid var(--line);border-radius:16px;background:rgba(255,255,255,.6);height:63px;font-size:18px;font-weight:700}.tipBtn.on{background:var(--ink);color:white;border-color:var(--ink)}.summary{margin-top:30px;padding-top:16px;border-top:1px solid var(--line)}.summary .detailRow{padding:12px 0}.summary .detailRow:last-child{border:0}.summary .total{font-size:19px}.summary .total strong{font-size:23px}.notice{display:flex;gap:10px;align-items:flex-start;padding:14px 0;font-size:12.5px;line-height:1.5;color:var(--muted)}.choice{margin-top:11px}.choice svg{width:25px;height:25px;stroke:currentColor;stroke-width:1.65;fill:none;stroke-linecap:round;stroke-linejoin:round;flex:none}.choice .mark{color:var(--blue);font-weight:700;font-size:11px}.receipt{background:#F8F6F0;padding:24px 20px;box-shadow:0 7px 24px rgba(27,24,21,.07);margin-top:20px;font-family:'IBM Plex Mono',monospace;font-size:12px}.receipt .detailRow{font-size:12px;padding:8px 0}.receipt .detailRow:last-child{border:0}.successRing{height:56px;width:56px;border:2px solid var(--ink);border-radius:50%;display:grid;place-items:center;margin-top:49px}.successRing svg{width:27px;height:27px}.history{margin-top:20px}.history .detailRow{border-bottom:1px solid var(--line);font-size:13px}.namePhone{font-size:16px;padding:0 3px}.tag{color:var(--blue);font-size:12px;font-weight:700}.mono{font-family:'IBM Plex Mono',monospace}.stampRow{display:flex;gap:8px;margin-top:18px}.stamp{height:48px;width:48px;border:1px solid var(--line);border-radius:50%;display:grid;place-items:center;font-size:22px;color:rgba(27,24,21,.20)}.stamp.filled{border:1px solid var(--blue);color:var(--blue)}.small-note{font-size:11.5px;line-height:1.5;color:var(--muted);margin-top:13px}.error{color:#a33122;font-size:12px;margin-top:8px}.footnote{margin-top:24px;color:var(--muted);font-size:11px;line-height:1.5}.badge{display:inline-block;border:1px solid rgba(18,36,244,.16);background:rgba(18,36,244,.07);padding:5px 9px;border-radius:99px;color:var(--blue);font-size:11px;font-weight:700}.statusrow{display:flex;justify-content:space-between;gap:10px;align-items:baseline}.divider{margin:24px 0;border-top:1px solid var(--line)}.eye{border:0;background:transparent;padding:3px;color:var(--muted);font-size:12px}.topright{display:flex;align-items:center;gap:8px}.cover{border-radius:19px;background:rgba(255,255,255,.34);padding:15px;margin-top:17px;border:1px solid var(--line)}.nudge{font-size:14px;margin-top:10px;color:var(--muted)}.blue{color:var(--blue)}
@keyframes rise{from{opacity:0;transform:translateY(11px);filter:blur(2px)}to{opacity:1;transform:none;filter:none}}@media(prefers-reduced-motion:reduce){*{animation-duration:.01ms!important;transition-duration:.01ms!important}}
@media(max-width:355px){.top{padding-left:21px;padding-right:21px}.screen{padding-left:21px;padding-right:21px}.hero{font-size:55px}.head{font-size:30px}.optTitle{font-size:14px}}
@media(min-width:600px){.app{border-left:1px solid var(--line);border-right:1px solid var(--line)}}
</style>
</head>
<body>
<div id="app" class="app" aria-live="polite"></div>
<script>
(()=>{
'use strict';
const items=[['Servicio de mesa',0],['Agua mineral 355ml',65],['Vaso chelado',25],['Clamato preparado',95],['Cerveza XX Lager 355ml',70],['Vodka Stolichnaya 750ml',120],['Pincho de alitas',185],['Cerveza XX Lager 355ml',70],['Ensalada de la casa',445],['Pollo orgánico bodegonero',595],['Vaso chelado',25],['Agua mineral 355ml',65],['Carajillo',190]].map(([name,price],id)=>({id,name,price}));
const FULL=1950,KEY='voraa-bodegon-demo-v1';
let saved;try{saved=JSON.parse(localStorage.getItem(KEY))}catch(e){}
let ledger=Array.isArray(saved?.ledger)?saved.ledger:[];
let stamp=!!saved?.stamp,screen=new URLSearchParams(location.search).get('view')==='staff'?'staff':'bill',history=[];
let split='full',parts=2,selected=new Set(),amountString='',tipMode='none',tipCustom='',method='card',phone='',error='';
const el=document.getElementById('app');
const fmt=n=>'$'+n.toLocaleString('es-MX',{minimumFractionDigits:2,maximumFractionDigits:2});
const fmtHero=n=>{const p=fmt(n).split('.');return `${p[0]}<span class="cents">.${p[1]}</span>`};
const paidBase=()=>Math.min(FULL,ledger.reduce((s,x)=>s+x.base,0));
const remaining=()=>Math.max(0,Math.round((FULL-paidBase())*100)/100);
const paidItems=()=>new Set(ledger.flatMap(x=>x.items||[]));
const isValid=n=>Number.isFinite(n)&&n>0&&n<=remaining()+.001;
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify({ledger,stamp}))}catch(e){}};
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const svg=(name)=>({check:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="m5 12 4 4L19 6"/></svg>',card:'<svg viewBox="0 0 24 24"><rect x="2" y="5" width="20" height="14" rx="3"/><path d="M2 10h20"/></svg>',wallet:'<svg viewBox="0 0 24 24"><rect x="2" y="4" width="20" height="16" rx="4"/><path d="M7 9h10M7 14h6"/></svg>',bank:'<svg viewBox="0 0 24 24"><path d="m2 9 10-6 10 6M4 9v10m5-10v10m6-10v10m5-10v10M2 21h20M2 9h20"/></svg>',terminal:'<svg viewBox="0 0 24 24"><rect x="5" y="2" width="14" height="20" rx="3"/><path d="M8 7h8M8 12h8M8 17h4"/></svg>'}[name]||'');
const startOver=()=>{split='full';parts=2;selected=new Set();amountString='';tipMode='none';tipCustom='';method='card';phone='';error='';};
function base(){if(split==='full')return remaining();if(split==='equal')return Math.round(remaining()/parts*100)/100;if(split==='items')return items.filter(x=>selected.has(x.id)&&!paidItems().has(x.id)).reduce((s,x)=>s+x.price,0);const v=Number(amountString);return Number.isFinite(v)?Math.round(v*100)/100:0}
function tip(){if(tipMode==='custom')return Math.max(0,Number(tipCustom)||0);return Math.round(base()*Number(tipMode)/100*100)/100}
const btn=(s,fn,disabled=false)=>`<button class="btn" ${disabled?'disabled':''} data-a="${fn}">${s}</button>`;
const secondary=(s,fn)=>`<button class="link" data-a="${fn}">${s}</button>`;
const detail=(key,value)=>`<div class="detailRow"><span>${key}</span><strong>${value}</strong></div>`;
const bottom=(primary,action,secondaryHTML='',disabled=false)=>`<div class="bottom">${btn(primary,action,disabled)}${secondaryHTML}</div>`;
const header=()=>`<header class="top"><div style="display:flex;align-items:center;gap:8px">${screen==='bill'||screen==='staff'||screen==='done'?'<span class="wordmark">voraa</span>':`<button aria-label="Volver" class="back" data-a="back">‹</button>`}</div><div class="topright"><span class="demo">Prototipo</span>${screen==='bill'?'<button class="eye" data-a="staff">Vista restaurante</button>':''}${screen==='staff'?'<button class="eye" data-a="bill">Vista cliente</button>':''}</div></header>`;
function place(){return `<div class="place"><div class="round">B</div><div><strong>Bodegón San Agustín</strong><div class="tiny">Mesa 14 · 2 personas · Obed M.</div></div></div>`}
function bill(){return `<div class="content">${place()}<div class="hero-label micro">Total de la cuenta</div><div class="hero">${fmtHero(FULL)}</div><div class="nudge">${remaining()===FULL?'Lista para pagar':remaining()===0?'Cuenta completamente liquidada':`${fmt(paidBase())} registrados en esta demostración`}</div><div class="meter"><div style="width:${paidBase()/FULL*100}%"></div></div><div class="detailRow" style="margin-top:30px"><span>Tu ticket</span><button data-a="ticket">Ver 13 artículos ↗</button></div>${detail('Saldo pendiente',fmt(remaining()))}<div class="cover"><div style="font-weight:700;font-size:14px">Una cuenta, muchas formas de pagar.</div><div class="tiny" style="margin-top:5px">Dividan sin hacer cálculos. Elijan su propina y cómo quiere pagar cada quien.</div></div><div class="footnote">Pago y conciliación simulados. No se realizará ningún cobro.</div></div>${bottom(remaining()>0?'Pagar o dividir':'Ver resumen de mesa',remaining()>0?'split':'staff',remaining()>0?secondary('Reiniciar demostración','reset'):'',false)}`}
function opt(id,title,sub,value=''){return `<button class="outline ${split===id?'sel':''}" data-split="${id}"><span class="dot">${split===id?svg('check'):''}</span><div class="grow"><div class="optTitle">${title}</div><div class="optSub">${sub}</div></div>${value?`<div class="value">${value}</div>`:''}</button>`}
function splitScreen(){const rem=remaining();let extra='';if(split==='equal')extra=`<div class="stepper"><div><div class="optTitle">¿Entre cuántas personas?</div><div class="tiny">Elige la parte que vas a pagar</div></div><div class="stepperBtns"><button aria-label="Menos personas" class="circleBtn" data-a="minus">−</button><span class="stepNum">${parts}</span><button aria-label="Más personas" class="circleBtn" data-a="plus">+</button></div></div><div class="detailRow" style="margin-top:15px"><span>Una parte</span><strong>${fmt(base())}</strong></div>`;
if(split==='custom')extra=`<div style="margin-top:26px"><div class="micro">Monto de tu parte · Máximo ${fmt(rem)}</div><input inputmode="decimal" type="number" min="0" max="${rem}" step="0.01" class="input" id="amount" placeholder="$0" value="${esc(amountString)}" aria-label="Monto de tu parte"></div>`;
if(split==='items')extra=`<div class="itemlist">${items.filter(x=>x.price>0).map(x=>`<label class="item ${paidItems().has(x.id)?'paid':''}"><input type="checkbox" data-item="${x.id}" ${selected.has(x.id)?'checked':''} ${paidItems().has(x.id)?'disabled':''}><span class="t">${esc(x.name)}</span><span class="p">${fmt(x.price)}</span></label>`).join('')}</div>`;
return `<div class="content"><div class="micro">Paso 1 de 3</div><h1 class="head">¿Cómo quieren dividir la cuenta?</h1><p class="desc">Tu parte se calcula antes de elegir la propina.</p>${opt('full','Pagar toda la cuenta','Una persona cubre el saldo',fmt(rem))}${opt('equal','Partes iguales','Cada quien paga lo mismo')}${opt('items','Por platillos','Selecciona lo que consumiste')}${opt('custom','Monto personalizado','Tú decides cuánto pagar')}${extra}<div class="footnote">Saldo pendiente: ${fmt(rem)}. Los pagos anteriores solo se comparten en este dispositivo.</div></div>${bottom(`Continuar · ${fmt(base())}`,'tip',secondary('Volver al ticket','bill'),!isValid(base()))}`}
function tipScreen(){const b=base(),t=tip();const modes=[['none','Sin propina'],['10','10%'],['15','15%'],['20','20%']];return `<div class="content"><div class="micro">Paso 2 de 3</div><h1 class="head">¿Dejamos propina?</h1><p class="desc">La propina se calcula únicamente sobre tu parte de la cuenta.</p><div class="micro" style="margin-top:34px">Tu consumo</div><div class="hero" style="margin-top:12px">${fmtHero(b)}</div><div class="tipgrid">${modes.map(([id,label])=>`<button class="tipBtn ${tipMode===id?'on':''}" data-tip="${id}">${label}</button>`).join('')}</div><button class="link" style="text-align:left;margin-top:9px" data-tip="custom">${tipMode==='custom'?'Propina personalizada ✓':'Otra cantidad'}</button>${tipMode==='custom'?`<div class="micro">Monto de propina</div><input class="input" type="number" inputmode="decimal" min="0" step="0.01" id="tipAmount" aria-label="Propina personalizada" placeholder="$0" value="${esc(tipCustom)}">`:''}<div class="summary">${detail('Tu parte',fmt(b))}${detail('Propina',fmt(t))}<div class="detailRow total"><span>Total a pagar</span><strong>${fmt(b+t)}</strong></div></div></div>${bottom('Continuar','method')}`}
function choose(id,title,sub,icon){return `<button class="outline choice ${method===id?'sel':''}" data-method="${id}"><span>${svg(icon)}</span><span class="grow"><span class="optTitle">${title}</span><div class="optSub">${sub}</div></span><span class="dot">${method===id?svg('check'):''}</span></button>`}
function methodScreen(){return `<div class="content"><div class="micro">Paso 3 de 3</div><h1 class="head">Elige cómo pagar.</h1><p class="desc">Cada persona puede pagar su parte de manera distinta.</p><div class="micro" style="margin-top:24px">Total de tu parte</div><div class="hero" style="font-size:57px;margin-top:10px">${fmtHero(base()+tip())}</div><div style="margin-top:26px">${choose('wallet','Apple Pay / Google Pay','Pago digital con tu teléfono · demo','wallet')}${choose('card','Tarjeta de crédito o débito','Pago en línea · demo','card')}${choose('terminal','Terminal del mesero','Pide la terminal y paga como siempre','terminal')}${choose('codi','CoDi · desde tu banco','Opcional · sujeto a activación en tu banco','bank')}</div><div class="footnote">El pago aún no está disponible. Ninguna opción realizará un cargo real.</div></div>${bottom('Continuar','review')}`}
function reviewScreen(){return `<div class="content">${place()}<div class="micro" style="margin-top:45px">${method==='terminal'?'Terminal solicitada':method==='codi'?'Solicitud CoDi':'Resumen de pago'}</div><div class="hero" style="margin-top:11px">${fmtHero(base()+tip())}</div><div class="summary">${detail('Consumo',fmt(base()))}${detail('Propina',fmt(tip()))}${detail('Método',({wallet:'Wallet',card:'Tarjeta',terminal:'Terminal',codi:'CoDi'})[method])}</div>${method==='codi'?`<div class="divider"></div><div class="optTitle">¿A qué número se enviaría el cobro?</div><p class="desc" style="margin-top:6px">En una versión real, tu banco podría enviarte una solicitud si tienes CoDi activado. No contactaremos ningún banco en esta demo.</p><input id="phone" type="tel" inputmode="numeric" pattern="[0-9]*" maxlength="10" class="input namePhone" placeholder="10 dígitos" aria-label="Número para solicitud CoDi" value="${esc(phone)}">${error?`<div class="error">${esc(error)}</div>`:''}`:method==='terminal'?`<p class="desc" style="margin-top:32px">En una versión real, Obed te trae la terminal. El restaurante marca el cobro como recibido después de verificarlo.</p>`:`<p class="desc" style="margin-top:32px">Este paso imita un pago autorizado. No estamos conectados a un procesador ni a un banco.</p>`}<div class="cover"><div class="optTitle">Este es un prototipo.</div><div class="tiny" style="margin-top:6px">El botón siguiente solo registrará un pago ficticio en este navegador. No introduces datos de tarjeta y no se mueve dinero.</div></div></div>${bottom(method==='terminal'?'Simular cobro con terminal':method==='codi'?'Simular pago CoDi':'Simular pago autorizado','pay')}`}
function successScreen(){const tx=ledger[ledger.length-1];return `<div class="content"><div class="successRing">${svg('check')}</div><h1 class="head" style="margin-top:26px">Tu parte está registrada.</h1><p class="desc">Pago simulado · ${tx?.methodLabel||'Método'}<br>Obed vería este movimiento asociado a Mesa 14.</p><div class="micro" style="margin-top:44px">Pago de prueba</div><div class="hero" style="margin-top:10px">${fmtHero((tx?.base||0)+(tx?.tip||0))}</div><div class="summary">${detail('Consumo registrado',fmt(tx?.base||0))}${detail('Propina registrada',fmt(tx?.tip||0))}${detail('Saldo de la mesa',fmt(remaining()))}</div><div class="cover"><div class="optTitle">También puedes guardar tu visita.</div><div class="tiny" style="margin-top:6px">Un sello para recordar que estuviste aquí. Es opcional y no afecta tu pago.</div></div></div>${bottom('Ver mi visita','loyalty',secondary('No, gracias · ver resumen de mesa','staff'))}`}
function loyaltyScreen(){return `<div class="content">${place()}<div class="micro" style="margin-top:40px">Lealtad · opcional</div><h1 class="head">Los buenos lugares se repiten.</h1><p class="desc">Guarda tu visita en una tarjeta de sellos. Sin puntos de dinero ni recompensas prometidas.</p><div class="serif" style="margin-top:40px">Tu tarjeta de visitas</div><div class="stampRow">${Array.from({length:5},(_,i)=>`<div class="stamp ${i===0&&stamp?'filled':''}">${i===0&&stamp?'★':'·'}</div>`).join('')}</div><div class="small-note">Ejemplo de concepto. El programa real y sus beneficios los define el restaurante. No se crea una cuenta en este prototipo.</div></div>${bottom(stamp?'Visita guardada ✓':'Guardar visita (demo)',stamp?'staff':'stamp',secondary('Ahora no','staff'))}`}
function staffScreen(){let totalTips=ledger.reduce((s,x)=>s+x.tip,0);return `<div class="content">${place()}<span class="badge">Vista restaurante · simulación</span><h1 class="head">Mesa 14</h1><p class="desc">Todos los movimientos de prueba en un solo lugar, vinculados al ticket.</p><div class="micro">Pendiente de cobrar</div><div class="hero" style="margin-top:12px">${fmtHero(remaining())}</div><div class="meter"><div style="width:${paidBase()/FULL*100}%"></div></div><div class="statusrow tiny"><span>${fmt(paidBase())} de ${fmt(FULL)} registrados</span><strong style="color:var(--ink)">${Math.round(paidBase()/FULL*100)}%</strong></div><div class="summary">${detail('Consumo registrado',fmt(paidBase()))}${detail('Propinas registradas',fmt(totalTips))}${detail('Movimientos',String(ledger.length))}</div><div class="micro" style="margin-top:26px">Movimientos por método</div><div class="history">${ledger.length?ledger.map((x,i)=>`<div class="detailRow"><span>#${String(i+1).padStart(2,'0')} · ${esc(x.methodLabel)}<div class="tiny">${esc(x.time)} · Consumo ${fmt(x.base)}${x.tip?` · Propina ${fmt(x.tip)}`:''}</div></span><strong>${fmt(x.base+x.tip)}</strong></div>`).join(''):'<div class="tiny" style="margin-top:15px">Aún no hay pagos simulados.</div>'}</div><div class="footnote">Atención: el resumen se guarda solo en este navegador. No existe sincronización multiusuario, conexión al POS ni conciliación bancaria real.</div></div>${bottom(remaining()>0?'Simular otro comensal':'Reiniciar para nueva prueba',remaining()>0?'next':'reset',secondary('Volver al ticket','bill'))}`}
function ticketScreen(){return `<div class="content"><div class="micro">Bodegón San Agustín · Mesa 14</div><h1 class="head">Detalle de la cuenta.</h1><div class="receipt"><div style="text-align:center;font-weight:700;font-size:14px">Bodegón San Agustín</div><div style="text-align:center;color:var(--muted);margin:7px 0 17px">13 artículos · Mesa 14 · Obed M.</div><div class="line"></div>${items.map(x=>detail(esc(x.name),fmt(x.price))).join('')}<div class="detailRow" style="font-weight:700;font-size:15px"><span>Gran total</span><strong>${fmt(FULL)}</strong></div></div><div class="footnote">Importes copiados del ticket de referencia de junio de 2026. Solo demostración.</div></div>${bottom('Volver a mi cuenta','bill')}`}
function back(){const map={split:'bill',tip:'split',method:'tip',review:'method',loyalty:'done',ticket:'bill',done:'staff',staff:'bill'};screen=map[screen]||'bill';render()}
function go(to){error='';history.push(screen);screen=to;window.scrollTo({top:0,behavior:'instant'});render()}
function pay(){if(!isValid(base())){error='Tu parte debe ser mayor a cero y no exceder el saldo.';render();return}if(method==='codi'&&!/^\d{10}$/.test(phone)){error='Escribe 10 dígitos para continuar con la simulación.';render();return}
ledger.push({base:base(),tip:tip(),methodLabel:{wallet:'Wallet',card:'Tarjeta',terminal:'Terminal',codi:'CoDi'}[method],time:new Date().toLocaleTimeString('es-MX',{hour:'2-digit',minute:'2-digit'}),items:split==='items'?Array.from(selected):[]});save();go('done')}
function reset(){ledger=[];stamp=false;save();startOver();go('bill')}
function render(){document.title=`${screen==='staff'?'Mesa 14':'Tu cuenta'} · Bodegón San Agustín | Voraa`;el.innerHTML=header()+`<main class="screen" key="${screen}">${({bill,split:splitScreen,tip:tipScreen,method:methodScreen,review:reviewScreen,done:successScreen,loyalty:loyaltyScreen,staff:staffScreen,ticket:ticketScreen})[screen]?.()||bill()}</main>`;
const amt=document.getElementById('amount');if(amt){amt.addEventListener('input',e=>{amountString=e.target.value;const btn=el.querySelector('[data-a="tip"]');if(btn){btn.disabled=!isValid(base());btn.textContent='Continuar · '+fmt(base())}})}
const tAmt=document.getElementById('tipAmount');if(tAmt)tAmt.addEventListener('input',e=>{tipCustom=e.target.value;const sum=el.querySelector('.summary');if(sum)sum.innerHTML=detail('Tu parte',fmt(base()))+detail('Propina',fmt(tip()))+`<div class="detailRow total"><span>Total a pagar</span><strong>${fmt(base()+tip())}</strong></div>`});
const ph=document.getElementById('phone');if(ph)ph.addEventListener('input',e=>{phone=e.target.value.replace(/\D/g,'').slice(0,10);e.target.value=phone});}
el.addEventListener('click',e=>{const s=e.target.closest('[data-split]');if(s){split=s.dataset.split;selected=new Set();render();return}const t=e.target.closest('[data-tip]');if(t){tipMode=t.dataset.tip;render();return}const m=e.target.closest('[data-method]');if(m){method=m.dataset.method;render();return}const it=e.target.closest('[data-item]');if(it){const id=Number(it.dataset.item);if(it.checked)selected.add(id);else selected.delete(id);const btn=el.querySelector('[data-a="tip"]');if(btn){btn.disabled=!isValid(base());btn.textContent='Continuar · '+fmt(base())}return}const b=e.target.closest('[data-a]');if(!b)return;switch(b.dataset.a){case'back':back();break;case'plus':parts=Math.min(12,parts+1);render();break;case'minus':parts=Math.max(2,parts-1);render();break;case'bill':go('bill');break;case'staff':go('staff');break;case'split':startOver();go('split');break;case'tip':if(isValid(base()))go('tip');break;case'method':go('method');break;case'review':go('review');break;case'pay':pay();break;case'loyalty':go('loyalty');break;case'stamp':stamp=true;save();go('staff');break;case'next':startOver();go('split');break;case'reset':reset();break;case'ticket':go('ticket');break;}});
render();
})();
</script>
</body></html>
